name: Build AI details PDF

on:
  push:
    paths:
      - '支撑材料/build_ai_details_pdf.py'
      - '.github/workflows/build-ai-details-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install --upgrade markdown weasyprint

      - name: Build PDF
        run: python '支撑材料/build_ai_details_pdf.py'

      - name: Commit generated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '支撑材料/AI 工具使用详情.pdf'
          if ! git diff --cached --quiet; then
            git commit -m 'Add final AI tool usage details PDF'
            git push
          fi
